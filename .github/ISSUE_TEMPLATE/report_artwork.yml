name: Report an affected artwork
description: Document a digital artwork affected by a dependency change
labels: ["artwork-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you submit

        This timeline documents digital artworks affected by dependency changes, for preservation
        and research. Entries are curatorial and **neutral, third-person**. This is not a
        promotional venue — please don't use a submission to advertise your own work or link to
        your shop, mint/listing page, or socials. Primarily-promotional submissions are closed.

  - type: input
    id: title
    attributes:
      label: Title
      description: Name of the artwork
      placeholder: "Twistori"
    validations:
      required: true

  - type: input
    id: artist
    attributes:
      label: Artist
      description: Creator(s) of the artwork
      placeholder: "Amy Hoy & Thomas Fuchs"
    validations:
      required: true

  - type: input
    id: year
    attributes:
      label: Year
      description: Year the artwork was created
      placeholder: "2008"

  - type: input
    id: url
    attributes:
      label: URL
      description: "Original, canonical, or archived URL of the artwork. Not a shop, mint, or social link."
      placeholder: "http://twistori.com"

  - type: input
    id: medium
    attributes:
      label: Medium
      description: "Type of artwork (e.g., Web application, Browser extension)"
      placeholder: "Web application"

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "Describe the artwork and the technologies it depends on. Neutral and factual, third person."
      placeholder: A brief description of what this artwork is and how it works.
    validations:
      required: true

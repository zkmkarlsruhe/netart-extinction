name: Report an extinction event
description: Document a dependency change that broke digital artworks
labels: ["event-submission"]
body:
  - type: markdown
    attributes:
      value: |
        ## Before you submit

        This timeline documents **extinction events** — dependency changes that broke digital
        artworks — for preservation and research. Entries are curatorial and written in a
        **neutral, third-person** voice.

        This is **not** a promotional venue. Please don't use a submission to feature your own
        work, or to link to your website, shop, mint/listing page, or social accounts.
        Submissions that are primarily self-promotion, link-building, or personal essays will be
        closed. Describe the **event and its impact on artworks**, not yourself.

  - type: input
    id: title
    attributes:
      label: Title
      description: Short descriptive title for this event
      placeholder: "e.g., Twitter API v1.1 Free Tier Shutdown"
    validations:
      required: true

  - type: input
    id: date
    attributes:
      label: Date
      description: "When did this happen? (YYYY, YYYY-MM, or YYYY-MM-DD)"
      placeholder: "2023-02-09"
    validations:
      required: true

  - type: input
    id: dependency
    attributes:
      label: Dependency
      description: What technology or service changed?
      placeholder: "Twitter API v1.1"
    validations:
      required: true

  - type: dropdown
    id: event_type
    attributes:
      label: Event type
      options:
        - api-shutdown
        - plugin-eol
        - browser-change
        - platform-shutdown
        - protocol-change
        - corporate-acquisition
        - terms-of-service
        - hardware-obsolescence
        - sdk-deprecation
        - os-deprecation
        - certificate-expiry
        - data-loss
        - format-obsolescence
        - network-shutdown
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: "What changed and why does it matter? Neutral and factual, third person — describe the event and its impact on digital artworks, not a personal or artist statement."
      placeholder: Describe what happened, what broke, and the impact on digital artworks.
    validations:
      required: true

  - type: textarea
    id: artworks
    attributes:
      label: Affected artworks
      description: "Works impacted by this event (title, artist, year, and a canonical or archived URL if known). This is documentation — not a place to promote your own catalogue."
      placeholder: |
        - Twistori by Amy Hoy & Thomas Fuchs (http://twistori.com)
        - ...

  - type: textarea
    id: links
    attributes:
      label: Links
      description: "URLs to announcements, news coverage, or documentation of the event. Not links to your own portfolio, shop, or social profiles."
      placeholder: |
        - https://example.com/announcement

  - type: textarea
    id: fixes
    attributes:
      label: Fixes
      description: "Known preservation efforts, migrations, or archival status (e.g. re-pinning, emulation, Wayback captures). Describe options neutrally — please don't promote a specific paid product, service, or token."
      placeholder: Describe any known fixes or mitigations.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute CalVer tag
        id: calver
        run: echo "tag=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_IMAGE }}:${{ steps.calver.outputs.tag }}
            ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_IMAGE }}:${{ github.sha }}
            ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trigger downstream gitops update
        run: |
          curl -sk -X POST "${{ vars.RENOVATE_TRIGGER_URL }}" \
            -F "token=${{ secrets.RENOVATE_TRIGGER_TOKEN }}" \
            -F "ref=main" \
            -F "variables[RENOVATE_REPOSITORIES]=${{ vars.RENOVATE_GITOPS_REPO }}" \
            -F "variables[RENOVATE_AUTODISCOVER]=false"

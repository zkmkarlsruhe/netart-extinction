name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute CalVer tag
        id: calver
        run: echo "tag=$(date -u +%Y.%m.%d).${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub (avoid anonymous rate limit on node/nginx base pulls)
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.HARBOR_REGISTRY }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_IMAGE }}:${{ steps.calver.outputs.tag }}
            ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_IMAGE }}:${{ github.sha }}
            ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Bump image tag in gitops repo
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_DEPLOY_TOKEN }}
          GITOPS_REPO: ${{ vars.RENOVATE_GITOPS_REPO }}
          NEW_TAG: ${{ steps.calver.outputs.tag }}
          IMAGE: ${{ vars.HARBOR_REGISTRY }}/${{ vars.HARBOR_IMAGE }}
        run: |
          set -euo pipefail
          git clone --depth 1 "https://oauth2:${GITOPS_TOKEN}@git.zkm.de/${GITOPS_REPO}.git" gitops
          cd gitops
          sed -i -E "s|(${IMAGE}):[^\"' ]+|\1:${NEW_TAG}|" docker-compose.yml
          if git diff --quiet; then
            echo "image tag already at ${NEW_TAG}; nothing to commit"
            exit 0
          fi
          git config user.email "deploy-bot@extinction.zkm.de"
          git config user.name "extinction-timeline deploy-bot"
          git commit -am "Pin image to CalVer ${NEW_TAG}"
          git push
